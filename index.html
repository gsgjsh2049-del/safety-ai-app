<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전보건 정보센터</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f0f2f5; min-height: 100dvh; }
.header { background: #1a4a7a; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.header img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
.header h1 { font-size: 15px; font-weight: 600; }
.header p { font-size: 11px; opacity: 0.75; margin-top: 2px; }
.main { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.menu-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; color: white; text-align: left; }
.btn-blue { background: #1a4a7a; }
.btn-teal { background: #16a085; }
.btn-purple { background: #8e44ad; }
.btn-orange { background: #e67e22; }
.btn-green { background: #27ae60; }
.btn-red { background: #c0392b; }
.btn-darkblue { background: #2980b9; }
.btn-yellow { background: #f39c12; }
.calc-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-top: 4px; }
.calc-result { margin: 12px; padding: 14px; border-radius: 10px; text-align: center; font-size: 15px; font-weight: 600; }
.sub-panel { display: none; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.panel-title { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #eee; font-size: 13px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 8px; }
.back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.grid1 { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.cat-btn { padding: 14px 10px; border: 1px solid #dde; border-radius: 8px; background: #f0f4ff; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; color: #2c3e7a; }
.cat-btn.green { background: #f0fff4; border-color: #b2dfdb; color: #1b5e3b; }
.cat-btn.orange { background: #fff8f0; border-color: #ffcc99; color: #7a3c00; }
.file-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f8f8f8; border-radius: 8px; color: #333; font-size: 13px; border: 1px solid #eee; cursor: pointer; }
.file-item:active { background: #efefef; }
.safety-link { display: flex; align-items: center; gap: 10px; padding: 14px; background: #e8f0fe; border-radius: 10px; color: #1a4a7a; font-size: 14px; font-weight: 500; border: 1px solid #c5d8f8; cursor: pointer; }
.loading { padding: 20px; text-align: center; color: #888; font-size: 13px; }
.pdf-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; flex-direction: column; }
.pdf-overlay.show { display: flex; }
.pdf-bar { background: #1a4a7a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.pdf-bar span { color: white; font-size: 14px; font-weight: 500; flex: 1; }
.pdf-bar a { color: #adf; font-size: 13px; text-decoration: none; margin-right: 12px; }
.pdf-bar button { background: none; border: none; color: white; font-size: 26px; cursor: pointer; }
iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<div class="header">
  <img src="/logo.jpg" alt="로고">
  <div>
    <h1>제일연마공업(주) 안전보건 정보센터</h1>
    <p>현장 안전보건 정보 제공 시스템</p>
  </div>
</div>
<div class="main">
  <button class="menu-btn btn-red" onclick="openPolicy()">📋 안전보건 경영방침</button>
  <button class="menu-btn btn-blue" onclick="togglePanel('p1')">🦺 작업별 안전조치사항</button>
  <div class="sub-panel" id="p1">
    <div class="panel-title">🦺 작업별 안전조치사항</div>
    <div class="grid1">
      <div class="safety-link" onclick="openPDF('/work-height.pdf','고소작업')">🔺 고소작업</div>
      <div class="safety-link" onclick="openPDF('/forklift.pdf','지게차 작업')">🚜 지게차 작업</div>
      <div class="safety-link" onclick="openPDF('/fire-work.pdf','화기작업')">🔥 화기작업</div>
      <div class="safety-link" onclick="openPDF('/equipment-check.pdf','설비점검')">🔧 설비점검</div>
    </div>
  </div>

  <button class="menu-btn btn-teal" onclick="togglePanel('p2'); initMSDS()">⚗️ MSDS 조회</button>
  <div class="sub-panel" id="p2">
    <div class="panel-title" id="msdsTitle">⚗️ 공정 선택</div>
    <div id="msdsBody"></div>
  </div>

  <button class="menu-btn btn-purple" onclick="togglePanel('p4'); initManual()">📄 안전보건매뉴얼</button>
<div class="sub-panel" id="p4">
  <div class="panel-title" id="manualTitle">📄 안전보건매뉴얼</div>
  <div id="manualBody"></div>
</div>
  <button class="menu-btn btn-orange" onclick="openPDF('개선제안 현황.pdf','개선제안 현황')">📋 개선제안 현황</button>
  <button class="menu-btn btn-green" onclick="togglePanel('p3'); initEdu()">📚 안전교육자료</button>
  <div class="sub-panel" id="p3">
  <div class="panel-title" id="eduTitle">📚 안전교육자료</div>
  <div id="eduBody"></div>
 </div>
  <button class="menu-btn btn-darkblue" onclick="togglePanel('p5'); initForklift()">🚜 지게차 관리</button>
<div class="sub-panel" id="p5">
  <div class="panel-title" id="forkliftTitle">🚜 지게차 관리</div>
  <div id="forkliftBody"></div>
</div>
  <button class="menu-btn btn-yellow" onclick="togglePanel('p6')">🌡️ 체감온도 계산기</button>
<div class="sub-panel" id="p6">
  <div class="panel-title">🌡️ 열지수 계산기 (더위)</div>
  <div style="padding:12px; display:flex; flex-direction:column; gap:10px;">
    <div>
      <label style="font-size:13px; color:#555;">기온 (°C)</label>
      <input class="calc-input" type="number" id="tempInput" placeholder="예: 33">
    </div>
    <div>
      <label style="font-size:13px; color:#555;">상대습도 (%)</label>
      <input class="calc-input" type="number" id="humidInput" placeholder="예: 70">
    </div>
    <button onclick="calcHeatIndex()" style="padding:12px; background:#f39c12; color:white; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">계산하기</button>
    <div id="heatResult"></div>
  </div>
</div>
</div>  

<div class="pdf-overlay" id="pdfOverlay">
  <div class="pdf-bar">
    <span id="pdfTitle">문서</span>
    <a id="pdfDownload" href="" target="_blank">⬇ 다운로드</a>
    <button onclick="closePDF()">✕</button>
  </div>
  <iframe id="pdfFrame" src=""></iframe>
</div>

<script>
const REPO = 'gsgjsh2049-del/safety-ai-app';
const BRANCH = 'main';

const msdsTree = {
  '비트리': { '원료': { '지립': { '알루미나': null, '실리콘카바이드': null }, '결합제': null }, '부재료': { '착색제': null, '점결제': null, '습윤제': null }, '기타': { '경화제': null, '도료': null, '세척제': null, '유류': null, '접착제': null, '함침제': null } },
  '레진': { '원료': { '지립': { '실리콘카바이드': null, '알루미나': null, '알루미나-지르코니아': null }, '결합제': { '노볼락(분말)': null, '레졸(액상)': null } }, '부재료': { '보강제': null, '습윤제': null, '착색제': null, '충진제': null, '기공제': null }, '기타': { '도료': null, '세척제': null, '이형제': null, '접착제': null, '유류': null } },
  '초지립': { '원료': { '지립': { '알루미나': null, '실리콘카바이드': null, 'CBN (일반)': null, 'CBN (코팅)': null, 'DIA (일반)': null, 'DIA (코팅)': null }, '결합제': { '노볼락(분말)': null, '레졸(액상)': null } }, '부재료': { '습윤제': null, '충진제': null }, '기타': { '세척제': null, '유류': { '방청유': null, '유압유': null, '작동유': null, '절삭유': null }, '접착제': null } },
  '중연삭': { '원료': { '지립': { '알루미나': null, '실리콘카바이드': null, '알루미나-지르코니아': null }, '결합제': { '노볼락(분말)': null } }, '부재료': { '보강제': null, '습윤제': null, '충진제': null }, '기타': { '도료': null, '세척제': null, '흡습제': null, '유류': { '연료유': null, '작동유': null, '방청유': null }, '이형제': null, '접착제': null } },
  '소성': { '기타': { '내화&단열제': null, '도료': null, '실리콘': null, '유류': { '윤활유': null, '방청유': null } } },
  '세공': { '기타': { '부싱': null, '유류': { '연료유': null } } },
  '검사': { '기타': { '도료': null, '세척제': null, '접착제': null, '탁도계 시편': null } },
  '공무': { '기타': { '연마석': { '절단용': null, '연마용': null }, '고압가스': null, '용접봉': { '일반용': null, '합금용': null }, '유류': { '작동유': null }, '도류': null } }
};

let mPath = [];
let panelOpen = {};

function togglePanel(id) {
  const el = document.getElementById(id);
  const isOpen = panelOpen[id];
  el.style.display = isOpen ? 'none' : 'block';
  panelOpen[id] = !isOpen;
}

function initMSDS() {
  if (mPath.length === 0) {
    mPath = [];
    renderMSDS();
  }
}

function renderMSDS() {
  const title = document.getElementById('msdsTitle');
  const body = document.getElementById('msdsBody');
  const backBtn = mPath.length > 0 ? '<button class="back-btn" onclick="goBack()">←</button> ' : '';
  title.innerHTML = backBtn + '⚗️ ' + (mPath.length > 0 ? mPath.join(' > ') : '공정 선택');

  let cur = msdsTree;
  for (const k of mPath) cur = cur[k];

  if (cur === null) { loadFiles(); return; }

  const keys = Object.keys(cur);
  const cls = mPath.length === 0 ? '' : mPath.length === 1 ? 'green' : 'orange';
  body.innerHTML = '<div class="grid2">' + keys.map(k => `<button class="cat-btn ${cls}" onclick="goNext('${k.replace(/'/g, "\\'")}')">${k}</button>`).join('') + '</div>';
}

function goNext(key) {
  mPath.push(key);
  let cur = msdsTree;
  for (const k of mPath) cur = cur[k];
  if (cur === null) loadFiles();
  else renderMSDS();
}

function goBack() {
  mPath.pop();
  renderMSDS();
}

async function loadFiles() {
  const body = document.getElementById('msdsBody');
  const title = document.getElementById('msdsTitle');
  title.innerHTML = '<button class="back-btn" onclick="goBack()">←</button> ⚗️ ' + mPath.join(' > ');
  body.innerHTML = '<div class="loading">📂 파일 목록 불러오는 중...</div>';

  const folderPath = 'MSDS/' + mPath.join('/');

  try {
    const res = await fetch('/api/msds?path=' + encodeURIComponent(folderPath));
    const files = await res.json();

    if (!Array.isArray(files)) {
      body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
      return;
    }

    const pdfs = files.filter(f => f.name.endsWith('.pdf'));

    if (pdfs.length === 0) {
      body.innerHTML = '<div class="loading">파일이 없습니다.</div>';
      return;
    }

    body.innerHTML = '<div class="grid1">' + pdfs.map(f => {
      const filePath = folderPath + '/' + f.name;
      const displayName = f.name.replace('.pdf', '');
      return `<div class="file-item" onclick="openPDF('${filePath.replace(/'/g,"\\'")}','${displayName.replace(/'/g,"\\'")}')">📄 ${displayName}</div>`;
    }).join('') + '</div>';

  } catch(e) {
    body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
  }
}

function openPDF(filePath, title) {
  const baseUrl = '/api/msds?path=' + encodeURIComponent(filePath);
  const isIphone = /iPhone/i.test(navigator.userAgent);

  document.getElementById('pdfTitle').textContent = title;

  const dlBtn = document.getElementById('pdfDownload');
  dlBtn.href = baseUrl + '&download=true';
  dlBtn.download = title + '.pdf';
  dlBtn.target = '_blank';
  dlBtn.rel = 'noopener noreferrer';

  if (isIphone) {
    // 아이폰: 새 탭으로 열기 → Safari 기본 PDF 뷰어 (전체 페이지 스크롤 가능)
    window.open(baseUrl + '&preview=true', '_blank');
    return;
  }

  // 컴퓨터, 갤럭시: 오버레이로 미리보기
  document.getElementById('pdfFrame').src = baseUrl + '&preview=true';
  document.getElementById('pdfOverlay').classList.add('show');
}

function closePDF() {
  document.getElementById('pdfOverlay').classList.remove('show');
  document.getElementById('pdfFrame').src = '';
}
let eduPath = [];
let eduPanelInit = false;

function initEdu() {
  if (!eduPanelInit) {
    eduPanelInit = true;
    eduPath = [];
    renderEdu();
  }
}

function renderEdu() {
  const title = document.getElementById('eduTitle');
  const body = document.getElementById('eduBody');

  if (eduPath.length === 0) {
    title.innerHTML = '📚 안전교육자료';
    body.innerHTML = `
      <div class="grid2" style="padding:12px;">
        <button class="cat-btn green" onclick="loadEduFiles('자체제작')">자체제작</button>
        <button class="cat-btn green" onclick="loadEduFiles('외부자료')">외부자료</button>
      </div>`;
  }
}

async function loadEduFiles(folder) {
  const body = document.getElementById('eduBody');
  const title = document.getElementById('eduTitle');
  title.innerHTML = `<button class="back-btn" onclick="resetEdu()">←</button> 📚 ${folder}`;
  body.innerHTML = '<div class="loading">📂 파일 목록 불러오는 중...</div>';

  const folderPath = '안전교육자료/' + folder;

  try {
    const res = await fetch('/api/msds?path=' + encodeURIComponent(folderPath));
    const files = await res.json();

    if (!Array.isArray(files)) {
      body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
      return;
    }

    const pdfs = files.filter(f => f.name.endsWith('.pdf'));

    if (pdfs.length === 0) {
      body.innerHTML = '<div class="loading">파일이 없습니다.</div>';
      return;
    }

    body.innerHTML = '<div class="grid1">' + pdfs.map(f => {
      const filePath = folderPath + '/' + f.name;
      const displayName = f.name.replace('.pdf', '');
      return `<div class="file-item" onclick="openPDF('${filePath.replace(/'/g,"\\'")}','${displayName.replace(/'/g,"\\'")}')">📄 ${displayName}</div>`;
    }).join('') + '</div>';

  } catch(e) {
    body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
  }
}

function resetEdu() {
  eduPanelInit = false;
  initEdu();
}
let manualPanelInit = false;

function initManual() {
  if (!manualPanelInit) {
    manualPanelInit = true;
    loadManualFiles();
  }
}

async function loadManualFiles() {
  const body = document.getElementById('manualBody');
  body.innerHTML = '<div class="loading">📂 파일 목록 불러오는 중...</div>';

  try {
    const res = await fetch('/api/msds?path=' + encodeURIComponent('안전보건매뉴얼'));
    const files = await res.json();

    if (!Array.isArray(files)) {
      body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
      return;
    }

    const pdfs = files.filter(f => f.name.endsWith('.pdf'));

    if (pdfs.length === 0) {
      body.innerHTML = '<div class="loading">파일이 없습니다.</div>';
      return;
    }

    body.innerHTML = '<div class="grid1">' + pdfs.map(f => {
      const filePath = '안전보건매뉴얼/' + f.name;
      const displayName = f.name.replace('.pdf', '');
      return `<div class="file-item" onclick="openPDF('${filePath.replace(/'/g,"\\'")}','${displayName.replace(/'/g,"\\'")}')">📄 ${displayName}</div>`;
    }).join('') + '</div>';

  } catch(e) {
    body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
  }
}
function openPolicy() {
  const isIphone = /iPhone/i.test(navigator.userAgent);
  const url = 'https://raw.githubusercontent.com/gsgjsh2049-del/safety-ai-app/main/경영방침.png';

  if (isIphone) {
    window.open(url, '_blank');
    return;
  }

  const overlay = document.createElement('div');
  overlay.id = 'policyOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999;display:flex;flex-direction:column;';

  overlay.innerHTML = `
    <div style="background:#1a4a7a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
      <span style="color:white;font-size:14px;font-weight:500;">안전보건 경영방침</span>
      <button onclick="closePolicy()" style="background:none;border:none;color:white;font-size:26px;cursor:pointer;">✕</button>
    </div>
    <div style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;">
      <img src="${url}" style="max-width:100%;max-height:100%;border-radius:8px;">
    </div>
  `;

  document.body.appendChild(overlay);

  // 뒤로가기 감지용 history 등록
  history.pushState({ policy: true }, '');
}

function closePolicy() {
  const overlay = document.getElementById('policyOverlay');
  if (overlay) overlay.remove();
}

// 뒤로가기 누르면 팝업 닫기
window.addEventListener('popstate', function(e) {
  const overlay = document.getElementById('policyOverlay');
  if (overlay) overlay.remove();
});
let forkliftPanelInit = false;

function initForklift() {
  if (!forkliftPanelInit) {
    forkliftPanelInit = true;
    loadForkliftFiles();
  }
}

async function loadForkliftFiles() {
  const body = document.getElementById('forkliftBody');
  body.innerHTML = '<div class="loading">📂 파일 목록 불러오는 중...</div>';

  try {
    const res = await fetch('/api/msds?path=' + encodeURIComponent('지게차 관리'));
    const files = await res.json();

    if (!Array.isArray(files)) {
      body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
      return;
    }

    const pdfs = files.filter(f => f.name.endsWith('.pdf'));

    if (pdfs.length === 0) {
      body.innerHTML = '<div class="loading">파일이 없습니다.</div>';
      return;
    }

    body.innerHTML = '<div class="grid1">' + pdfs.map(f => {
      const filePath = '지게차 관리/' + f.name;
      const displayName = f.name.replace('.pdf', '');
      return `<div class="file-item" onclick="openPDF('${filePath.replace(/'/g,"\\'")}','${displayName.replace(/'/g,"\\'")}')">📄 ${displayName}</div>`;
    }).join('') + '</div>';

  } catch(e) {
    body.innerHTML = '<div class="loading">파일을 불러올 수 없습니다.</div>';
  }
}
function calcHeatIndex() {
  const T = parseFloat(document.getElementById('tempInput').value);
  const R = parseFloat(document.getElementById('humidInput').value);
  const result = document.getElementById('heatResult');

  if (isNaN(T) || isNaN(R)) {
    result.innerHTML = '<div class="calc-result" style="background:#fff3cd; color:#856404;">기온과 습도를 입력해주세요.</div>';
    return;
  }

  const HIC = -2.2519 + 0.8396*T + 0.0842*R + 0.0007*T*T + 0.0018*T*R - 0.0004*R*R;

  let color, label;
  if (HIC < 27) {
    color = '#d4edda'; label = '😊 안전';
  } else if (HIC < 32) {
    color = '#fff3cd'; label = '⚠️ 수분섭취 필요';
  } else if (HIC < 41) {
    color = '#ffd6a5'; label = '🔶 냉방기 등을 활용하여 체감온도를 낮추세요';
  } else if (HIC < 54) {
    color = '#ffb3b3'; label = '🔴 휴식을 취하세요';
  } else {
    color = '#c0392b'; label = '☠️ 매우 위험';
  }

  result.innerHTML = `
    <div class="calc-result" style="background:${color}; color:#333;">
      <div style="font-size:20px; margin-bottom:6px;">${label}</div>
      <div style="font-size:24px; font-weight:700;">열지수 ${HIC.toFixed(1)}°C</div>
    </div>`;
}
</script>
</body>
</html>
