<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전보건 정보센터</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f0f2f5; min-height: 100dvh; }
.header { background: #1a4a7a; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.header img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
.header h1 { font-size: 15px; font-weight: 600; }
.header p { font-size: 11px; opacity: 0.75; margin-top: 2px; }
.main { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.menu-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; color: white; text-align: left; }
.btn-blue { background: #1a4a7a; }
.btn-teal { background: #16a085; }
.btn-purple { background: #8e44ad; }
.sub-panel { display: none; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.panel-title { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #eee; font-size: 13px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 8px; }
.back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.grid1 { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.cat-btn { padding: 14px 10px; border: 1px solid #dde; border-radius: 8px; background: #f0f4ff; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; color: #2c3e7a; }
.cat-btn:active { background: #dce3ff; }
.cat-btn.green { background: #f0fff4; border-color: #b2dfdb; color: #1b5e3b; }
.cat-btn.orange { background: #fff8f0; border-color: #ffcc99; color: #7a3c00; }
.file-link { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f8f8f8; border-radius: 8px; text-decoration: none; color: #333; font-size: 13px; border: 1px solid #eee; cursor: pointer; }
.file-link:active { background: #efefef; }
.safety-link { display: flex; align-items: center; gap: 10px; padding: 14px; background: #e8f0fe; border-radius: 10px; text-decoration: none; color: #1a4a7a; font-size: 14px; font-weight: 500; border: 1px solid #c5d8f8; cursor: pointer; }
.safety-link:active { background: #d0e2fc; }
.pdf-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; flex-direction: column; }
.pdf-overlay.show { display: flex; }
.pdf-bar { background: #1a4a7a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.pdf-bar span { color: white; font-size: 14px; font-weight: 500; }
.pdf-bar button { background: none; border: none; color: white; font-size: 26px; cursor: pointer; line-height: 1; }
.pdf-bar a { color: #adf; font-size: 13px; text-decoration: none; }
iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<div class="header">
  <img src="/logo.jpg" alt="로고">
  <div>
    <h1>제일연마공업(주) 안전보건 정보센터</h1>
    <p>현장 안전보건 정보 제공 시스템</p>
  </div>
</div>

<div class="main">

  <!-- 작업별 안전조치사항 -->
  <button class="menu-btn btn-blue" onclick="togglePanel('p1')">🦺 작업별 안전조치사항</button>
  <div class="sub-panel" id="p1">
    <div class="panel-title">🦺 작업별 안전조치사항</div>
    <div class="grid1">
      <div class="safety-link" onclick="openPDF('/work-height.pdf','고소작업')">🔺 고소작업</div>
      <div class="safety-link" onclick="openPDF('/forklift.pdf','지게차 작업')">🚜 지게차 작업</div>
      <div class="safety-link" onclick="openPDF('/fire-work.pdf','화기작업')">🔥 화기작업</div>
      <div class="safety-link" onclick="openPDF('/equipment-check.pdf','설비점검')">🔧 설비점검</div>
    </div>
  </div>

  <!-- MSDS -->
  <button class="menu-btn btn-teal" onclick="togglePanel('p2'); initMSDS()">⚗️ MSDS 조회</button>
  <div class="sub-panel" id="p2">
    <div class="panel-title" id="msdsTitle">⚗️ 공정 선택</div>
    <div id="msdsBody"></div>
  </div>

  <!-- 안전보건매뉴얼 -->
  <button class="menu-btn btn-purple" onclick="openPDF('/safety-manual.pdf','안전보건매뉴얼')">📄 안전보건매뉴얼</button>

</div>

<!-- PDF 뷰어 -->
<div class="pdf-overlay" id="pdfOverlay">
  <div class="pdf-bar">
    <span id="pdfTitle">문서</span>
    <a id="pdfDownload" href="" download target="_blank">⬇ 다운로드</a>
    <button onclick="closePDF()">✕</button>
  </div>
  <iframe id="pdfFrame" src=""></iframe>
</div>

<script>
// MSDS 데이터 구조
const msds = {
  '비트리': {
    '원료': { '지립': { '알루미나': null, '실리콘카바이드': null }, '결합제': null },
    '부재료': { '착색제': null, '점결제': null, '습윤제': null },
    '기타': { '경화제': null, '도류': null, '세척제': null, '유류': null, '접착제': null, '합침제': null }
  },
  '레진': {
    '원료': { '지립': { '실리콘카바이드': null, '알루미나': null, '알루미나-지르코니아': null }, '결합제': { '노볼락(분말)': null, '레졸(액상)': null } },
    '부재료': { '보강재': null, '습윤제': null, '착색제': null, '충진제': null, '기공제': null },
    '기타': { '도류': null, '세척제': null, '이형제': null, '접착제': null, '유류': null }
  },
  '초지립': {
    '원료': { '지립': { '알루미나': null, '실리콘카바이드': null, 'CBN계(원반)': null, 'CBN계(고링)': null, 'DIA계(원반)': null, 'DIA계(고링)': null, 'DIA계(고링,높고링)': null }, '결합제': { '노볼락(분말)': null, '레졸(액상)': null } },
    '부재료': { '습윤제': null, '충진제': null },
    '기타': { '세척제': null, '유류': { '방청유': null, '유압유': null, '작동유': null, '절삭유': null }, '접착제': null }
  },
  '중연삭': {
    '원료': { '지립': { '알루미나': null, '실리콘카바이드': null, '알루미나&지르코니아': null }, '결합제': { '노볼락(분말)': null } },
    '부재료': { '보강재': null, '습윤제': null, '충진제': null },
    '기타': { '도류': null, '세척제': null, '출습제': null, '유류': { '연료유': null, '작동유': null, '방청유': null }, '이형제': null, '접착제': null }
  },
  '소성': {
    '기타': { '내화&단열제': null, '도류': null, '실리콘': null, '유류': { '윤활유': null, '방청유': null } }
  },
  '세공': {
    '기타': { '부싱': null, '유류': { '연료유': null } }
  },
  '검사': {
    '기타': { '도료': null, '세척제': null, '접착제': null, '탁도 시편': null }
  },
  '공무': {
    '기타': { '연마석': { '절단용': null, '연마용': null }, '고압가스': null, '용접봉': { '일반용': null, '합금용': null }, '유류': { '작동유': null }, '도류': null }
  }
};

let path = [];

function initMSDS() {
  path = [];
  renderMSDS();
}

function renderMSDS() {
  const title = document.getElementById('msdsTitle');
  const body = document.getElementById('msdsBody');
  const backBtn = path.length > 0 ? '<button class="back-btn" onclick="goBack()">←</button> ' : '';
  const pathStr = path.length > 0 ? path.join(' > ') : '공정 선택';
  title.innerHTML = backBtn + '⚗️ ' + pathStr;

  let current = msds;
  for (const k of path) current = current[k];

  if (current === null) {
    // 파일 목록
    const folderPath = path.join('/');
    body.innerHTML = '<div class="grid1"><div class="file-link" onclick="openFolder(\'' + folderPath + '\')">📂 파일 목록 보기</div></div>';
    return;
  }

  const keys = Object.keys(current);
  const colorClass = path.length === 0 ? '' : path.length === 1 ? 'green' : 'orange';
  body.innerHTML = '<div class="grid2">' + keys.map(k => '<button class="cat-btn ' + colorClass + '" onclick="goNext(\'' + k.replace(/'/g, "\\'") + '\')">' + k + '</button>').join('') + '</div>';
}

function goNext(key) {
  path.push(key);
  let current = msds;
  for (const k of path) current = current[k];
  if (current === null) {
    const folderPath = 'MSDS/' + path.join('/');
    const body = document.getElementById('msdsBody');
    const title = document.getElementById('msdsTitle');
    title.innerHTML = '<button class="back-btn" onclick="goBack()">←</button> ⚗️ ' + path.join(' > ');
    body.innerHTML = '<div class="grid1"><div class="file-link" onclick="openFolder(\'' + folderPath + '\')">📂 파일 목록 보기</div></div>';
  } else {
    renderMSDS();
  }
}

function goBack() {
  path.pop();
  renderMSDS();
}

function openFolder(folderPath) {
  const encoded = folderPath.split('/').map(encodeURIComponent).join('/');
  window.open('/' + encoded + '/', '_blank');
}

function togglePanel(id) {
  const el = document.getElementById(id);
  const isOpen = el.style.display === 'block';
  el.style.display = isOpen ? 'none' : 'block';
}

function openPDF(url, title) {
  document.getElementById('pdfTitle').textContent = title;
  document.getElementById('pdfFrame').src = url;
  document.getElementById('pdfDownload').href = url;
  document.getElementById('pdfOverlay').classList.add('show');
}

function closePDF() {
  document.getElementById('pdfOverlay').classList.remove('show');
  document.getElementById('pdfFrame').src = '';
}
</script>
</body>
</html>
