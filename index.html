<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전보건 정보센터</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; min-height: 100dvh; }
.header { background: #1a4a7a; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
.header img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
.header h1 { font-size: 15px; font-weight: 600; }
.header p { font-size: 11px; opacity: 0.75; margin-top: 2px; }
.main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.menu-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; color: white; }
.btn-safety { background: #1a4a7a; }
.btn-msds { background: #16a085; }
.btn-manual { background: #8e44ad; }

/* 패널 */
.panel { display: none; background: white; border-radius: 12px; overflow: hidden; }
.panel.active { display: block; }
.panel-header { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #eee; font-size: 13px; font-weight: 500; color: #333; display: flex; align-items: center; gap: 6px; }
.back-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #666; padding: 0 4px; }

/* 그리드 버튼 */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px; }
.item-btn { padding: 12px 8px; border: 1px solid #e0e0e0; border-radius: 8px; background: white; font-size: 13px; cursor: pointer; text-align: center; color: #333; }
.item-btn:active { background: #f0f0f0; }
.item-btn.blue { background: #E6F1FB; border-color: #B5D4F4; color: #0C447C; }
.item-btn.green { background: #EAF3DE; border-color: #B5D9A0; color: #27500A; }
.item-btn.teal { background: #E0F5F0; border-color: #9FD9CC; color: #0D6B58; }

/* 파일 목록 */
.file-list { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.file-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f8f8f8; border-radius: 8px; text-decoration: none; color: #333; font-size: 13px; border: 1px solid #eee; }
.file-item:active { background: #e8e8e8; }

/* 작업안전 버튼 */
.safety-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.safety-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #E6F1FB; border-radius: 10px; text-decoration: none; color: #0C447C; font-size: 14px; font-weight: 500; border: 1px solid #B5D4F4; }

/* PDF 팝업 */
.pdf-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; }
.pdf-overlay.active { display: flex; }
.pdf-toolbar { background: #1a4a7a; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.pdf-toolbar span { color: white; font-size: 14px; font-weight: 500; }
.pdf-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
.pdf-frame { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<div class="header">
  <img src="/logo.jpg" alt="로고">
  <div>
    <h1>제일연마공업(주) 안전보건 정보센터</h1>
    <p>현장 안전보건 정보 제공 시스템</p>
  </div>
</div>

<div class="main">

  <!-- 작업별 안전조치사항 -->
  <button class="menu-btn btn-safety" onclick="togglePanel('safetyPanel')">
    🦺 작업별 안전조치사항
  </button>
  <div class="panel" id="safetyPanel">
    <div class="panel-header">🦺 작업별 안전조치사항</div>
    <div class="safety-list">
      <a class="safety-item" onclick="openPDF('/work-height.pdf', '고소작업')">🔺 고소작업</a>
