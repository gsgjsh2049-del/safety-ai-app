<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전보건 정보센터</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f0f2f5; min-height: 100dvh; }
.header { background: #1a4a7a; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.header img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
.header h1 { font-size: 15px; font-weight: 600; }
.header p { font-size: 11px; opacity: 0.75; margin-top: 2px; }
.icon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
.icon-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; }
.icon-circle { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.1s; }
.icon-btn:active .icon-circle { transform: scale(0.92); }
.icon-label { font-size: 11px; font-weight: 600; color: #333; text-align: center; line-height: 1.3; word-break: keep-all; }
.ic-red{background:#c0392b} .ic-blue{background:#1a4a7a} .ic-teal{background:#16a085}
.ic-purple{background:#8e44ad} .ic-orange{background:#e67e22} .ic-green{background:#27ae60}
.ic-darkblue{background:#2980b9} .ic-yellow{background:#f39c12} .ic-brown{background:#795548}
.sub-panel { display: none; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin: 0 16px 12px; }
.panel-title { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #eee; font-size: 13px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 8px; }
.back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.grid1 { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.cat-btn { padding: 14px 10px; border: 1px solid #dde; border-radius: 8px; background: #f0f4ff; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; color: #2c3e7a; }
.cat-btn.green { background: #f0fff4; border-color: #b2dfdb; color: #1b5e3b; }
.cat-btn.orange { background: #fff8f0; border-color: #ffcc99; color: #7a3c00; }
.file-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f8f8f8; border-radius: 8px; color: #333; font-size: 13px; border: 1px solid #eee; cursor: pointer; }
.file-item:active { background: #efefef; }
.safety-link { display: flex; align-items: center; gap: 10px; padding: 14px; background: #e8f0fe; border-radius: 10px; color: #1a4a7a; font-size: 14px; font-weight: 500; border: 1px solid #c5d8f8; cursor: pointer; }
.loading { padding: 20px; text-align: center; color: #888; font-size: 13px; }
.calc-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-top: 4px; }
.calc-result { margin: 12px; padding: 14px; border-radius: 10px; text-align: center; font-size: 15px; font-weight: 600; }
.pdf-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; flex-direction: column; }
.pdf-overlay.show { display: flex; }
.pdf-bar { background: #1a4a7a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.pdf-bar span { color: white; font-size: 14px; font-weight: 500; flex: 1; }
.pdf-bar a { color: #adf; font-size: 13px; text-decoration: none; margin-right: 12px; }
.pdf-bar button { background: none; border: none; color: white; font-size: 26px; cursor: pointer; }
iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<div class="header">
  <img src="/logo.jpg" alt="로고">
  <div>
    <h1>제일연마공업(주) 안전보건 정보센터</h1>
    <p>현장 안전보건 정보 제공 시스템</p>
  </div>
</div>

<div class="icon-grid">
  <button class="icon-btn" onclick="openPolicy()">
    <div class="icon-circle ic-red">📋</div><span class="icon-label">안전보건<br>경영방침</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p1')">
    <div class="icon-circle ic-blue">🦺</div><span class="icon-label">작업별<br>안전조치</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p2'); initPanel('p2')">
    <div class="icon-circle ic-teal">⚗️</div><span class="icon-label">MSDS<br>조회</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p4'); initPanel('p4')">
    <div class="icon-circle ic-purple">📄</div><span class="icon-label">안전보건<br>매뉴얼</span>
  </button>
  <button class="icon-btn" onclick="openPDF('개선제안 현황.pdf','개선제안 현황')">
    <div class="icon-circle ic-orange">📋</div><span class="icon-label">개선제안<br>현황</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p3'); initPanel('p3')">
    <div class="icon-circle ic-green">📚</div><span class="icon-label">안전교육<br>자료</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p5'); initPanel('p5')">
    <div class="icon-circle ic-darkblue">🚜</div><span class="icon-label">지게차<br>관리</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p6')">
    <div class="icon-circle ic-yellow">🌡️</div><span class="icon-label">체감온도<br>계산기</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p7'); initPanel('p7')">
    <div class="icon-circle ic-brown">🔍</div><span class="icon-label">안전합동<br>점검</span>
  </button>
  <button class="icon-btn" onclick="togglePanel('p8'); initPanel('p8')">
    <div class="icon-circle ic-red">📝</div><span class="icon-label">각종<br>양식</span>
  </button>
</div>

<!-- 패널들 -->
<div class="sub-panel" id="p1">
  <div class="panel-title">🦺 작업별 안전조치사항</div>
  <div class="grid1">
    <div class="safety-link" onclick="openPDF('/work-height.pdf','고소작업')">🔺 고소작업</div>
    <div class="safety-link" onclick="openPDF('/forklift.pdf','지게차 작업')">🚜 지게차 작업</div>
    <div class="safety-link" onclick="openPDF('/fire-work.pdf','화기작업')">🔥 화기작업</div>
    <div class="safety-link" onclick="openPDF('/equipment-check.pdf','설비점검')">🔧 설비점검</div>
  </div>
</div>
<div class="sub-panel" id="p2">
  <div class="panel-title" id="p2-title">⚗️ 공정 선택</div>
  <div id="p2-body"></div>
</div>
<div class="sub-panel" id="p4">
  <div class="panel-title" id="p4-title">📄 안전보건매뉴얼</div>
  <div id="p4-body"></div>
</div>
<div class="sub-panel" id="p3">
  <div class="panel-title" id="p3-title">📚 안전교육자료</div>
  <div id="p3-body"></div>
</div>
<div class="sub-panel" id="p5">
  <div class="panel-title" id="p5-title">🚜 지게차 관리</div>
  <div id="p5-body"></div>
</div>
<div class="sub-panel" id="p6">
  <div class="panel-title">🌡️ 열지수 계산기 (더위)</div>
  <div style="padding:12px; display:flex; flex-direction:column; gap:10px;">
    <div><label style="font-size:13px;color:#555;">기온 (°C)</label><input class="calc-input" type="number" id="tempInput" placeholder="예: 33"></div>
    <div><label style="font-size:13px;color:#555;">상대습도 (%)</label><input class="calc-input" type="number" id="humidInput" placeholder="예: 70"></div>
    <button onclick="calcHeatIndex()" style="padding:12px;background:#f39c12;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">계산하기</button>
    <div id="heatResult"></div>
  </div>
</div>
<div class="sub-panel" id="p7">
  <div class="panel-title" id="p7-title">🔍 안전합동점검</div>
  <div id="p7-body"></div>
</div>
<div class="sub-panel" id="p8">
  <div class="panel-title" id="p8-title">📝 각종양식</div>
  <div id="p8-body"></div>
</div>

<div class="pdf-overlay" id="pdfOverlay">
  <div class="pdf-bar">
    <button onclick="closePDF()" style="font-size:20px;margin-right:10px;">← 뒤로</button>
    <span id="pdfTitle">문서</span>
    <a id="pdfDownload" href="" target="_blank">⬇ 다운로드</a>
  </div>
  <iframe id="pdfFrame" src=""></iframe>
</div>

<script>
// ── MSDS 트리 ──────────────────────────────────────────────
const msdsTree = {
  '비트리': { '원료': { '지립': { '알루미나': null, '실리콘카바이드': null }, '결합제': null }, '부재료': { '착색제': null, '점결제': null, '습윤제': null }, '기타': { '경화제': null, '도료': null, '세척제': null, '유류': null, '접착제': null, '함침제': null } },
  '레진': { '원료': { '지립': { '실리콘카바이드': null, '알루미나': null, '알루미나-지르코니아': null }, '결합제': { '노볼락(분말)': null, '레졸(액상)': null } }, '부재료': { '보강제': null, '습윤제': null, '착색제': null, '충진제': null, '기공제': null }, '기타': { '도료': null, '세척제': null, '이형제': null, '접착제': null, '유류': null } },
  '초지립': { '원료': { '지립': { '알루미나': null, '실리콘카바이드': null, 'CBN (일반)': null, 'CBN (코팅)': null, 'DIA (일반)': null, 'DIA (코팅)': null }, '결합제': { '노볼락(분말)': null, '레졸(액상)': null } }, '부재료': { '습윤제': null, '충진제': null }, '기타': { '세척제': null, '유류': { '방청유': null, '유압유': null, '작동유': null, '절삭유': null }, '접착제': null } },
  '중연삭': { '원료': { '지립': { '알루미나': null, '실리콘카바이드': null, '알루미나-지르코니아': null }, '결합제': { '노볼락(분말)': null } }, '부재료': { '보강제': null, '습윤제': null, '충진제': null }, '기타': { '도료': null, '세척제': null, '흡습제': null, '유류': { '연료유': null, '작동유': null, '방청유': null }, '이형제': null, '접착제': null } },
  '소성': { '기타': { '내화&단열제': null, '도료': null, '실리콘': null, '유류': { '윤활유': null, '방청유': null } } },
  '세공': { '기타': { '부싱': null, '유류': { '연료유': null } } },
  '검사': { '기타': { '도료': null, '세척제': null, '접착제': null, '탁도계 시편': null } },
  '공무': { '기타': { '연마석': { '절단용': null, '연마용': null }, '고압가스': null, '용접봉': { '일반용': null, '합금용': null }, '유류': { '작동유': null }, '도류': null } }
};

// ── 공통 유틸 ───────────────────────────────────────────────
const panelOpen = {};
const panelInited = {};

function togglePanel(id) {
  const isOpen = panelOpen[id];
  document.querySelectorAll('.sub-panel').forEach(p => {
    p.style.display = 'none';
    panelOpen[p.id] = false;
  });
  if (!isOpen) {
    document.getElementById(id).style.display = 'block';
    panelOpen[id] = true;
  }
}

function initPanel(id) {
  if (panelInited[id]) return;
  panelInited[id] = true;
  ({ p2: renderMSDS, p3: renderEdu, p4: loadSimpleFolder('안전보건매뉴얼', 'p4'),
     p5: loadSimpleFolder('지게차 관리', 'p5'), p7: loadInspectionDates,
     p8: loadFolderPanel('각종양식', 'p8', '📝 각종양식') })[id]?.();
}

async function fetchFolder(path) {
  const res = await fetch('/api/msds?path=' + encodeURIComponent(path));
  const data = await res.json();
  return Array.isArray(data) ? data : null;
}

function setTitle(panelId, html) { document.getElementById(panelId + '-title').innerHTML = html; }
function setBody(panelId, html) { document.getElementById(panelId + '-body').innerHTML = html; }
function loading(panelId) { setBody(panelId, '<div class="loading">📂 파일 목록 불러오는 중...</div>'); }
function errMsg(panelId) { setBody(panelId, '<div class="loading">파일을 불러올 수 없습니다.</div>'); }
function esc(s) { return s.replace(/'/g, "\\'"); }
function backBtn(onclick) { return `<button class="back-btn" onclick="${onclick}">←</button> `; }

function pdfListHTML(files, folderPath) {
  const pdfs = files.filter(f => f.name.endsWith('.pdf'));
  if (!pdfs.length) return '<div class="loading">파일이 없습니다.</div>';
  return '<div class="grid1">' + pdfs.map(f => {
    const fp = folderPath + '/' + f.name, dn = f.name.replace('.pdf','');
    return `<div class="file-item" onclick="openPDF('${esc(fp)}','${esc(dn)}')">📄 ${dn}</div>`;
  }).join('') + '</div>';
}

function folderBtnsHTML(folders, cls, onclickFn) {
  return '<div class="grid2" style="padding:12px;">' +
    folders.map(f => `<button class="cat-btn ${cls}" onclick="${onclickFn(f.name)}">${f.name}</button>`).join('') + '</div>';
}

// ── 단순 폴더(PDF만) 로더 팩토리 ───────────────────────────
function loadSimpleFolder(folderPath, panelId) {
  return async function() {
    loading(panelId);
    const files = await fetchFolder(folderPath).catch(() => null);
    setBody(panelId, files ? pdfListHTML(files, folderPath) : '<div class="loading">파일을 불러올 수 없습니다.</div>');
  };
}

// ── PDF 뷰어 ────────────────────────────────────────────────
function openPDF(filePath, title) {
  const url = '/api/msds?path=' + encodeURIComponent(filePath);
  document.getElementById('pdfTitle').textContent = title;
  const dl = document.getElementById('pdfDownload');
  const isMSDS = filePath.includes('MSDS') || filePath.includes('msds');
  dl.style.display = isMSDS ? 'none' : '';
  dl.href = url + '&download=true'; dl.download = title + '.pdf';
  if (/iPhone/i.test(navigator.userAgent)) {
    const toast = document.createElement('div');
    toast.textContent = '문서를 닫으려면 ✕ 또는 왼쪽으로 슬라이드하세요';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:white;padding:10px 16px;border-radius:20px;font-size:13px;z-index:9999;text-align:center;white-space:nowrap;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
    window.open(url + '&preview=true', '_blank'); return;
  }
  document.getElementById('pdfFrame').src = url + '&preview=true';
  document.getElementById('pdfOverlay').classList.add('show');
}
function closePDF() {
  document.getElementById('pdfOverlay').classList.remove('show');
  document.getElementById('pdfFrame').src = '';
}

// ── 경영방침 ────────────────────────────────────────────────
function openPolicy() {
  const url = 'https://raw.githubusercontent.com/gsgjsh2049-del/safety-ai-app/main/경영방침.png';
  if (/iPhone/i.test(navigator.userAgent)) { window.open(url, '_blank'); return; }
  const ov = document.createElement('div');
  ov.id = 'policyOverlay';
  ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999;display:flex;flex-direction:column;';
  ov.innerHTML = `<div style="background:#1a4a7a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
    <span style="color:white;font-size:14px;font-weight:500;">안전보건 경영방침</span>
    <button onclick="closePolicy()" style="background:none;border:none;color:white;font-size:26px;cursor:pointer;">✕</button></div>
    <div style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;">
    <img src="${url}" style="max-width:100%;max-height:100%;border-radius:8px;"></div>`;
  document.body.appendChild(ov);
  history.pushState({ policy: true }, '');
}
function closePolicy() { document.getElementById('policyOverlay')?.remove(); }
window.addEventListener('popstate', closePolicy);

// ── MSDS ────────────────────────────────────────────────────
let mPath = [];
function renderMSDS() {
  let cur = msdsTree;
  for (const k of mPath) cur = cur[k];
  const back = mPath.length ? backBtn('msdsBack()') : '';
  setTitle('p2', back + '⚗️ ' + (mPath.length ? mPath.join(' > ') : '공정 선택'));
  if (cur === null) { loadMSDSFiles(); return; }
  const cls = ['', 'green', 'orange'][Math.min(mPath.length, 2)];
  setBody('p2', '<div class="grid2">' +
    Object.keys(cur).map(k => `<button class="cat-btn ${cls}" onclick="msdsNext('${esc(k)}')">${k}</button>`).join('') + '</div>');
}
function msdsNext(k) { mPath.push(k); renderMSDS(); }
function msdsBack() { mPath.pop(); renderMSDS(); }
async function loadMSDSFiles() {
  loading('p2');
  const path = 'MSDS/' + mPath.join('/');
  const files = await fetchFolder(path).catch(() => null);
  setBody('p2', files ? pdfListHTML(files, path) : '<div class="loading">파일을 불러올 수 없습니다.</div>');
}

// ── 안전교육자료 ────────────────────────────────────────────
function renderEdu() {
  setTitle('p3', '📚 안전교육자료');
  setBody('p3', `<div class="grid2" style="padding:12px;">
    <button class="cat-btn green" onclick="loadEduSub('자체제작')">자체제작</button>
    <button class="cat-btn green" onclick="loadEduSub('외부자료')">외부자료</button></div>`);
}
async function loadEduSub(folder) {
  setTitle('p3', backBtn('renderEdu()') + '📚 ' + folder);
  loading('p3');
  const path = '안전교육자료/' + folder;
  const files = await fetchFolder(path).catch(() => null);
  setBody('p3', files ? pdfListHTML(files, path) : '<div class="loading">파일을 불러올 수 없습니다.</div>');
}

// ── 안전합동점검 ────────────────────────────────────────────
async function loadInspectionDates() {
  setTitle('p7', '🔍 안전합동점검');
  loading('p7');
  const items = await fetchFolder('안전합동점검').catch(() => null);
  if (!items) { errMsg('p7'); return; }
  const folders = items.filter(f => f.type === 'dir');
  setBody('p7', folders.length ? folderBtnsHTML(folders, '', n => `loadInspectionProcesses('${esc(n)}')`) : '<div class="loading">데이터가 없습니다.</div>');
}
async function loadInspectionProcesses(date) {
  setTitle('p7', backBtn('loadInspectionDates()') + '🔍 ' + date);
  loading('p7');
  const items = await fetchFolder('안전합동점검/' + date).catch(() => null);
  if (!items) { errMsg('p7'); return; }
  const folders = items.filter(f => f.type === 'dir');
  setBody('p7', folders.length ? folderBtnsHTML(folders, 'green', n => `checkInspectionPW('${esc(date)}','${esc(n)}')`) : '<div class="loading">공정 폴더가 없습니다.</div>');
}
function checkInspectionPW(date, process) {
  loadInspectionFiles(date, process);
}
async function loadInspectionFiles(date, process) {
  const path = '안전합동점검/' + date + '/' + process;
  setTitle('p7', backBtn(`loadInspectionProcesses('${esc(date)}')`) + `🔍 ${date} > ${process}`);
  loading('p7');
  const files = await fetchFolder(path).catch(() => null);
  setBody('p7', files ? pdfListHTML(files, path) : '<div class="loading">파일을 불러올 수 없습니다.</div>');
}

// ── 각종양식 (범용 폴더 브라우저) ───────────────────────────
function loadFolderPanel(rootPath, panelId, rootTitle) {
  return () => browseFolder(rootPath, panelId, rootTitle, null);
}
async function browseFolder(path, panelId, label, backFn) {
  setTitle(panelId, (backFn ? backBtn(backFn) : '') + label);
  loading(panelId);
  const items = await fetchFolder(path).catch(() => null);
  if (!items) { errMsg(panelId); return; }
  const folders = items.filter(f => f.type === 'dir');
  const pdfs = items.filter(f => f.name.endsWith('.pdf'));
  if (!folders.length && !pdfs.length) { setBody(panelId, '<div class="loading">파일이 없습니다.</div>'); return; }
  const myBack = `browseFolder('${esc(path)}','${panelId}','${esc(label)}',${backFn ? `'${esc(backFn)}'` : 'null'})`;
  let html = '';
  if (folders.length) html += '<div class="grid2" style="padding:12px 12px 4px;">' +
    folders.map(f => `<button class="cat-btn" onclick="browseFolder('${esc(path+'/'+f.name)}','${panelId}','📝 ${esc(f.name)}','${esc(myBack)}')">${f.name}</button>`).join('') + '</div>';
  if (pdfs.length) html += pdfListHTML(items, path);
  setBody(panelId, html);
}

// ── 열지수 계산기 ───────────────────────────────────────────
function calcHeatIndex() {
  const T = parseFloat(document.getElementById('tempInput').value);
  const R = parseFloat(document.getElementById('humidInput').value);
  const el = document.getElementById('heatResult');
  if (isNaN(T) || isNaN(R)) { el.innerHTML = '<div class="calc-result" style="background:#fff3cd;color:#856404;">기온과 습도를 입력해주세요.</div>'; return; }
  const H = -2.2519 + 0.8396*T + 0.0842*R + 0.0007*T*T + 0.0018*T*R - 0.0004*R*R;
  const [color, label] = H < 27 ? ['#d4edda','😊 안전'] : H < 32 ? ['#fff3cd','⚠️ 수분섭취 필요'] :
    H < 41 ? ['#ffd6a5','🔶 냉방기 등을 활용하여 체감온도를 낮추세요'] : H < 54 ? ['#ffb3b3','🔴 휴식을 취하세요'] : ['#c0392b','☠️ 매우 위험'];
  el.innerHTML = `<div class="calc-result" style="background:${color};color:#333;"><div style="font-size:20px;margin-bottom:6px;">${label}</div><div style="font-size:24px;font-weight:700;">열지수 ${H.toFixed(1)}°C</div></div>`;
}
</script>
